# Records any new or changed words and sentences with Pocket TTS (voice "eponine") and commits
# the MP3s, so editing a list on github.com is all it takes to get recordings for it.
name: Make recordings

on:
  push:
    paths: ["words.js", "sentences.js", "passages.js", "stories.js", "activities.js", "speech-text.js",
            "tools/make_audio.py", "tools/activity_lines.mjs", ".github/workflows/audio.yml"]
  workflow_dispatch:

permissions:
  contents: write

# One run at a time: a run that starts while another is recording waits for it, then starts from
# the latest main, so it already has the earlier run's recordings
concurrency:
  group: recordings
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Keep the voice model between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: pocket-tts-eponine

      - name: Install Pocket TTS (CPU only) and the MP3 encoder
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pocket-tts lameenc

      - name: List everything the activities say
        run: node tools/activity_lines.mjs

      - name: Record new words, sentences and activity lines
        run: python tools/make_audio.py

      - name: Commit the recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node tools/build.mjs
          git add audio tools/lines.json *.html
          git diff --cached --quiet && exit 0
          git commit -m "Add recordings for new words"
          # Recording takes a while, so main may have moved on: catch up, then push (a few tries)
          for try in 1 2 3; do
            git pull --rebase --no-edit && git push && exit 0
            sleep 10
          done
          exit 1
