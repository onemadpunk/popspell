# Records any new or changed words and sentences with Pocket TTS (voice "eponine") and commits
# the MP3s, so editing a list on github.com is all it takes to get recordings for it.
name: Make recordings

on:
  push:
    paths: ["words.js", "sentences.js", "passages.js", "stories.js", "tools/make_audio.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Keep the voice model between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: pocket-tts-eponine

      - name: Install Pocket TTS (CPU only) and the MP3 encoder
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pocket-tts lameenc

      - name: Record new words and sentences
        run: python tools/make_audio.py

      - name: Commit the recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          git diff --cached --quiet || { git commit -m "Add recordings for new words" && git push; }
